name: astrbot_plugin_zhiyu_toolbox
display_name: 知喻工具箱
short_desc: 知喻的多功能工具箱：状态查询、发言清洗、发送节流、群聊总闸
desc: >-
  自制多功能插件，管理员用自然语言口令操作，面板配置同步可改，改完立即生效并落盘。
  一、运行状态查询：说「查状态」「跑多久了」「今天用了多少 token」等直接发状态卡片，
  卡片由 Pillow 本地绘制的田字格图片（黑底白字，不调模型、不耗 token，失败自动回退文本卡）；
  不进模型、不写会话历史、不进记忆库；数据全部来自本机文件，不联网、不输出密钥和地址。
  二、发言清洗：发送前最后一道处理，删占位词、括号动作、复述与拼贴，压波浪号、限长、去重；
  模型输出 <refuse/> 主动拒答标签且无实质内容时，整条不发送（配合人格卡沉默机制）。
  三、发送节流：全局 60 秒滑动窗口限制插话条数（口令「群聊上限N」可改），
  单群插话间隔随机（口令「聊天间隔A-B」可改），被@的回复不计数；
  send_message_to_user 框架旁路直发也纳入同一账本。
  四、群聊总闸：「关闭群聊/开启群聊」一键让所有群静默或恢复。
  五、WebUI 控制台视图：在 AstrBot 面板的插件视图里打开「工具箱控制台」，
  可看实时状态、开关群聊总闸、直接修改全部配置。
  管理员身份按真实 QQ 号硬校验，非管理员发管理口令一律静默忽略。
version: 1.11.1
author: ningmengcha7055
astrbot_version: ">=4.27.0"
support_platforms:
  - aiocqhttp
tags:
  - 工具
  - 状态
  - 节流
